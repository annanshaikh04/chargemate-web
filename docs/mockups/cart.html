<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cordline — Cart (mockup)</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 600: '#0284c7', 700: '#0369a1' }, ink: { 50: '#f8fafc', 100: '#f1f5f9', 500: '#64748b', 800: '#1e293b', 900: '#0f172a' } },
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'], display: ['Sora', 'system-ui', 'sans-serif'] },
          borderRadius: { 'ds': '0.75rem', 'ds-lg': '1rem' },
          boxShadow: { 'card': '0 1px 2px rgb(0 0 0 / 0.06), 0 4px 12px rgb(0 0 0 / 0.06)' },
        },
      },
    };
  </script>
</head>
<body class="bg-ink-50 text-ink-900 antialiased">
  <header class="sticky top-0 z-40 border-b border-ink-100 bg-white/95 backdrop-blur">
    <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3" aria-label="Primary">
      <a href="home.html" class="flex items-center gap-2">
        <span class="flex h-9 w-9 items-center justify-center rounded-ds bg-brand-700 font-display text-sm font-bold text-white">C</span>
        <span class="font-display text-lg font-semibold">Cordline</span>
      </a>
      <ul class="hidden items-center gap-8 text-sm font-medium text-ink-700 md:flex">
        <li><a href="home.html" class="hover:text-brand-700">Home</a></li>
        <li><a href="shop.html" class="hover:text-brand-700">Shop</a></li>
        <li><a href="fund.html" class="hover:text-brand-700">Fund</a></li>
        <li><a href="about.html" class="hover:text-brand-700">About</a></li>
      </ul>
      <span class="text-sm font-semibold text-brand-700">Cart (1)</span>
    </nav>
  </header>

  <main id="main" class="mx-auto max-w-3xl px-4 py-10">
    <h1 class="font-display text-3xl font-bold">Cart</h1>
    <p class="mt-2 text-sm text-ink-500">Prototype — quantities are UI only.</p>

    <ul class="mt-8 divide-y divide-ink-100 rounded-ds-lg border border-ink-100 bg-white shadow-card" role="list">
      <li class="flex flex-col gap-4 p-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex gap-4">
          <div class="h-20 w-20 shrink-0 rounded-ds bg-ink-100"></div>
          <div>
            <h2 class="font-display font-semibold">Cordline Core</h2>
            <p class="text-sm text-ink-500">$89 each</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <label class="sr-only" for="qty-1">Quantity</label>
          <div class="flex items-center rounded-ds border border-ink-200">
            <button type="button" class="px-3 py-2 text-ink-600 hover:bg-ink-50" aria-label="Decrease">−</button>
            <input id="qty-1" type="text" readonly value="1" class="w-10 border-x border-ink-200 py-2 text-center text-sm" />
            <button type="button" class="px-3 py-2 text-ink-600 hover:bg-ink-50" aria-label="Increase">+</button>
          </div>
          <p class="font-display font-semibold">$89</p>
        </div>
      </li>
    </ul>

    <div class="mt-6 rounded-ds-lg border border-ink-100 bg-white p-6 shadow-card">
      <div class="flex justify-between text-sm">
        <span class="text-ink-500">Subtotal</span>
        <span class="font-semibold">$89</span>
      </div>
      <button type="button" disabled class="mt-6 w-full cursor-not-allowed rounded-ds bg-ink-200 py-3 text-sm font-semibold text-ink-500">Checkout — coming soon</button>
      <p class="mt-3 text-center text-xs text-ink-500">No payment processing in v1 prototype.</p>
    </div>
  </main>

  <footer class="border-t border-ink-100 bg-white">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-8 sm:flex-row sm:items-center sm:justify-between">
      <p class="text-sm text-ink-500">© Cordline (placeholder)</p>
      <a href="legal.html" class="text-sm font-medium text-brand-700">Legal</a>
    </div>
  </footer>
</body>
</html>
